<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拳刃交鋒</title>
<style>
  :root { --bg: #0A0F1A; --plate: #101827; --ink: #F4F3EE; --muted: #8592A4; --focus: #FFF5D8; --gold: #F4D58C; --p1: #D58941; --p2: #4BB381; --red: #FF4F62; --blue: #58B6FF; --edge: #394B61; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; overflow: hidden; }
  [hidden] { display: none !important; }
  .screen { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; }
  .panel { width: min(440px, 100%); display: flex; flex-direction: column; gap: 10px; }
  h1 { margin: 0 0 4px; font-size: 34px; letter-spacing: .2em; text-align: center; color: var(--focus); text-shadow: 3px 3px 0 #10121B; }
  .sub { margin: 0 0 12px; text-align: center; color: var(--muted); font-size: 13px; }
  .btn { display: flex; flex-direction: column; gap: 2px; text-align: left; font: inherit; color: var(--ink); background: var(--plate); border: 2px solid var(--edge); border-radius: 4px; padding: 12px 14px; cursor: pointer; box-shadow: 0 3px 0 #10121B; }
  .btn:hover, .btn:focus-visible { border-color: var(--focus); outline: none; }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #10121B; }
  .btn b { font-size: 16px; } .btn small { color: var(--muted); font-size: 12px; }
  .btn.hot { border-color: var(--gold); } .btn.hot b::after { content: "　新手推薦"; color: var(--gold); font-size: 12px; }
  a.back { text-decoration: none; font-size: 14px; }
  .back { align-self: flex-start; background: none; border: 0; color: var(--muted); font: inherit; cursor: pointer; padding: 4px 0; }
  .row { display: flex; gap: 8px; }
  input.code { flex: 1; font: 700 22px/1 monospace; letter-spacing: .4em; text-transform: uppercase; text-align: center; color: var(--ink); background: var(--plate); border: 2px solid var(--edge); border-radius: 4px; padding: 10px; }
  .err { color: var(--red); font-size: 13px; min-height: 1.2em; margin: 0; }
  .link { font: 12px monospace; color: var(--muted); word-break: break-all; margin: 0; }
  #game { padding: 0; place-items: center; }
  canvas#screen { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  .bar { position: fixed; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 10px; pointer-events: none; z-index: 4; }   /* 房間面板開著時，上排按鈕（回大廳、出招提示、延遲）仍可按 */
  .bar > * { pointer-events: auto; }
  .tag { font-size: 12px; color: var(--muted); background: rgba(16,24,39,.8); padding: 4px 8px; border-radius: 4px; }
  .tiny { font: 600 12px/1 inherit; color: var(--ink); background: var(--plate); border: 1px solid var(--edge); border-radius: 4px; padding: 7px 10px; cursor: pointer; }
  #objective { position: fixed; left: 50%; top: 40px; transform: translateX(-50%); max-width: calc(100% - 24px); font-size: 15px; font-weight: 700; color: var(--focus); background: rgba(16,24,39,.9); border: 2px solid var(--gold); border-radius: 4px; padding: 8px 14px; z-index: 2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #objective.retry { border-color: var(--red); color: #FFD0A1; }
  .tiny.hint[aria-pressed="false"] { color: var(--muted); }
  .panel > .tiny.hint { align-self: center; }
  #ping[data-q="good"] { color: #7FE3A0; } #ping[data-q="ok"] { color: var(--gold); } #ping[data-q="bad"] { color: var(--red); }
  .overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(10,15,26,.62); z-index: 3; padding: 16px; }
  .roomCard { width: min(420px, 100%); max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: 8px; background: var(--plate); border: 2px solid var(--gold); border-radius: 6px; padding: 14px 16px; box-shadow: 0 6px 0 #05080F; }
  .rTitle { margin: 0; text-align: center; color: var(--muted); font-size: 13px; } .rTitle b { display: block; font: 800 40px/1.1 monospace; letter-spacing: .3em; color: var(--focus); padding-left: .3em; }
  .rHead { margin: 0; text-align: center; font-weight: 800; color: var(--gold); min-height: 1.2em; }
  .copy { align-self: center; font-size: 14px; padding: 9px 14px; border-color: var(--gold); }
  .seats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seat { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border: 2px solid var(--edge); border-radius: 4px; font-size: 13px; color: var(--muted); }
  .seat b { color: var(--ink); } .seat.on { border-color: #4E7A63; } .seat.on span::before { content: "● "; color: #7FE3A0; }
  .seat.ready { border-color: var(--gold); background: rgba(244,213,140,.08); } .seat.ready span { color: var(--gold); font-weight: 800; }
  .btn.ready { align-items: center; text-align: center; border-color: var(--gold); } .btn.ready b { font-size: 20px; letter-spacing: .2em; } .btn.ready.on { background: #2B3A2E; border-color: #7FE3A0; }
  #rcOver .btn { flex: 1; align-items: center; text-align: center; }
  .roomCard .back { align-self: center; }
  .bigCount { position: fixed; inset: 0; display: grid; place-items: center; font: 900 min(30vw, 180px)/1 monospace; color: var(--focus); text-shadow: 6px 6px 0 #10121B; z-index: 3; pointer-events: none; background: rgba(10,15,26,.35); }
  #pauseBox { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); font-size: 18px; font-weight: 800; color: var(--focus); background: rgba(16,24,39,.94); border: 2px solid var(--red); border-radius: 6px; padding: 14px 20px; z-index: 3; text-align: center; }
  #debug { position: fixed; left: 8px; bottom: 8px; margin: 0; font: 11px/1.4 monospace; color: #9fffa8; background: rgba(10,15,26,.85); padding: 6px 8px; border-radius: 4px; z-index: 2; white-space: pre; }
  .keys { font-size: 12px; color: var(--muted); text-align: center; margin: 8px 0 0; }
  .toggles { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .field input { font: 700 18px/1.2 inherit; color: var(--ink); background: var(--plate); border: 2px solid var(--edge); border-radius: 4px; padding: 9px 10px; }
  .pop { position: fixed; top: 44px; right: 10px; z-index: 5; display: flex; flex-direction: column; gap: 6px; background: rgba(16,24,39,.97); border: 1px solid var(--gold); border-radius: 6px; padding: 8px; }
  .pop.tray { display: grid; grid-template-columns: repeat(4, 48px); }
  .pop.tray[hidden], .pop[hidden] { display: none; }
  .tray button { font-size: 24px; height: 48px; border-radius: 6px; border: 1px solid var(--edge); background: var(--plate); color: var(--ink); cursor: pointer; }
  .tray button.txt { font: 900 16px/1 monospace; }
  .tray button:disabled { opacity: .4; }
  #coach { position: fixed; left: 50%; transform: translateX(-50%); max-width: calc(100% - 20px); z-index: 2; pointer-events: none; text-align: center;
    font-size: 14px; font-weight: 800; color: var(--focus); background: rgba(16,24,39,.92); border: 1px solid var(--gold); border-radius: 999px; padding: 5px 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body.touch #coach { font-size: 13px; white-space: normal; border-radius: 10px; }
  .rGuide { font-size: 13px; color: var(--muted); display: flex; justify-content: center; align-items: center; gap: 6px; }
  .rGuide input { width: 18px; height: 18px; accent-color: var(--gold); }
  #flowStrip { position: fixed; left: 50%; bottom: 18%; transform: translateX(-50%); z-index: 3; pointer-events: none; font-size: 15px; font-weight: 800; color: var(--focus); background: rgba(16,24,39,.92); border: 2px solid var(--gold); border-radius: 6px; padding: 8px 14px; text-align: center; max-width: calc(100% - 20px); }
  /* 觸控：遊戲畫面不捲動、不雙擊放大、不長按選字；選單按鈕維持一般點擊 */
  body.touch #game, body.touch canvas#screen { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  body.touch .tiny { padding: 10px 12px; font-size: 13px; }
  body.touch .bar { padding-top: calc(6px + env(safe-area-inset-top)); }
</style>
</head>
<body>
  <!-- 主選單 -->
  <section class="screen" id="menu" hidden>
    <div class="panel">
      <a class="back" id="homeLink" href="/">← 回來打橋牌</a>
      <h1>拳刃交鋒</h1>
      <p class="sub">七格浮空擂台・猜拳讀心・連打收頭</p>
      <button class="btn hot" data-go="tutorial"><b>互動教學道場</b><small>四關微教學：走位、讀心、連打彈反、閃紅招</small></button>
      <button class="btn" data-go="difficulty"><b>單人對戰 AI</b><small>新手木樁／道場師兄／讀心宗師</small></button>
      <button class="btn" data-go="local2p"><b>同機雙人（Local 2P）</b><small>P1 A／S／D　P2 J／K／L</small></button>
      <button class="btn" data-go="online"><b>線上對戰</b><small>建立房間，或輸入 4 碼房號加入</small></button>
      <div class="toggles"><button class="tiny hint" data-go="hints" aria-pressed="true">出招提示：開</button><button class="tiny hint" data-go="guide" aria-pressed="true">新手引導：開</button><button class="tiny hint" data-go="haptics" aria-pressed="true">震動：開</button></div>
      <p class="keys">左鍵＝石頭／往左　中鍵＝剪刀／原地　右鍵＝布／往右　｜　Esc 回大廳　` 除錯資訊</p>
    </div>
  </section>

  <!-- AI 難度 -->
  <section class="screen" id="difficulty" hidden>
    <div class="panel">
      <button class="back" data-go="menu">← 回大廳</button>
      <button class="btn" data-go="ai:easy"><b>新手木樁</b><small>反應慢、連打慢、很少開紅招</small></button>
      <button class="btn" data-go="ai:mid"><b>道場師兄</b><small>看你站崖邊又 80% 以上，就開紅招收頭</small></button>
      <button class="btn" data-go="ai:master"><b>讀心宗師</b><small>前搖假動作、最後藏招變拳、留 2 氣等你</small></button>
    </div>
  </section>

  <!-- 線上 -->
  <section class="screen" id="online" hidden>
    <div class="panel">
      <button class="back" data-go="menu">← 回大廳</button>
      <label class="field">你的暱稱<input id="nameInput" maxlength="16" placeholder="最多 8 個字" autocomplete="nickname" enterkeyhint="done"></label>
      <button class="btn" data-go="create"><b>建立房間</b><small>產生 4 碼房號，把網址傳給朋友</small></button>
      <div class="row"><input class="code" id="roomInput" maxlength="4" placeholder="房號" autocomplete="off" aria-label="4 碼房號"><button class="btn" data-go="join" style="flex:none"><b>加入</b></button></div>
      <p class="err" id="roomError"></p>
      <p class="link" id="roomLink"></p>
      <p class="keys">建立後會自動進房；把邀請連結傳給朋友，點開就直接加入</p>
    </div>
  </section>

  <!-- 遊戲 -->
  <section class="screen" id="game" hidden>
    <canvas id="screen" aria-label="拳刃交鋒 遊戲畫面"></canvas>
    <div class="bar">
      <span class="tag" id="modeTag"></span>
      <span class="row"><span class="tag" id="ping" hidden title="來回延遲（每 15 秒心跳）">-- ms</span><button class="tiny" id="emoteBtn" data-go="emotes" hidden aria-label="表情">😀</button><button class="tiny" id="gearBtn" data-go="settings" aria-label="設定">⚙️</button><button class="tiny" id="skipTut" data-go="skip" hidden>跳過教學</button><button class="tiny" data-go="menu">回大廳</button></span>
    </div>
    <div id="settingsPop" class="pop" hidden>
      <button class="tiny hint" data-go="hints" aria-pressed="true">出招提示：開</button>
      <button class="tiny hint" data-go="guide" aria-pressed="true">新手引導：開</button>
      <button class="tiny hint" data-go="haptics" aria-pressed="true">震動：開</button>
      <button class="tiny hint" data-go="hideEmotes" aria-pressed="true" id="hideEmotesBtn" hidden>對手表情：顯示</button>
    </div>
    <div id="emoteTray" class="pop tray" hidden></div>
    <div id="objective" hidden></div>
    <div id="coach" hidden></div>
    <div id="keybar" aria-label="鍵位提示"></div>
    <!-- 線上房間：待機（READY）／結算（Rematch、離開） -->
    <div id="room" class="overlay" hidden>
      <div class="roomCard" role="dialog" aria-label="線上房間">
        <p class="rTitle">房號 <b id="rcCode">----</b></p>
        <p class="rHead" id="rcHead"></p>
        <button class="tiny copy" id="rcCopy" data-go="copy">📋 一鍵複製邀請連結</button>
        <p class="link" id="rcLink"></p>
        <div class="seats"><div class="seat" id="seat0"></div><div class="seat" id="seat1"></div></div>
        <div class="rGuide" id="rcGuide"></div>
        <button class="btn ready" id="rcReady" data-go="ready" hidden><b>READY</b><small>雙方都準備好後倒數 3 秒開戰</small></button>
        <div class="row" id="rcOver" hidden><button class="btn" id="rcRematch" data-go="rematch"><b>再來一局（Rematch）</b><small>雙方都按就原地重開</small></button></div>
        <button class="back" data-go="leave">離開房間</button>
        <p class="err" id="rcMsg"></p>
      </div>
    </div>
    <div id="countdown" class="bigCount" hidden>3</div>
    <div id="flowStrip" hidden></div>
    <div id="pauseBox" hidden></div>
    <pre id="debug" hidden></pre>
  </section>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
