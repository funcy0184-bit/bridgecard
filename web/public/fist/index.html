<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拳刃交鋒</title>
<style>
  :root { --bg: #0A0F1A; --plate: #101827; --ink: #F4F3EE; --muted: #8592A4; --focus: #FFF5D8; --gold: #F4D58C; --p1: #D58941; --p2: #4BB381; --red: #FF4F62; --blue: #58B6FF; --edge: #394B61; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; overflow: hidden; }
  [hidden] { display: none !important; }
  .screen { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; }
  .panel { width: min(440px, 100%); display: flex; flex-direction: column; gap: 10px; }
  h1 { margin: 0 0 4px; font-size: 34px; letter-spacing: .2em; text-align: center; color: var(--focus); text-shadow: 3px 3px 0 #10121B; }
  .sub { margin: 0 0 12px; text-align: center; color: var(--muted); font-size: 13px; }
  .btn { display: flex; flex-direction: column; gap: 2px; text-align: left; font: inherit; color: var(--ink); background: var(--plate); border: 2px solid var(--edge); border-radius: 4px; padding: 12px 14px; cursor: pointer; box-shadow: 0 3px 0 #10121B; }
  .btn:hover, .btn:focus-visible { border-color: var(--focus); outline: none; }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #10121B; }
  .btn b { font-size: 16px; } .btn small { color: var(--muted); font-size: 12px; }
  .btn.hot { border-color: var(--gold); } .btn.hot b::after { content: "　新手推薦"; color: var(--gold); font-size: 12px; }
  .back { align-self: flex-start; background: none; border: 0; color: var(--muted); font: inherit; cursor: pointer; padding: 4px 0; }
  .row { display: flex; gap: 8px; }
  input.code { flex: 1; font: 700 22px/1 monospace; letter-spacing: .4em; text-transform: uppercase; text-align: center; color: var(--ink); background: var(--plate); border: 2px solid var(--edge); border-radius: 4px; padding: 10px; }
  .err { color: var(--red); font-size: 13px; min-height: 1.2em; margin: 0; }
  .link { font: 12px monospace; color: var(--muted); word-break: break-all; margin: 0; }
  #game { padding: 0; place-items: center; }
  canvas#screen { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  .bar { position: fixed; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 10px; pointer-events: none; z-index: 2; }
  .bar > * { pointer-events: auto; }
  .tag { font-size: 12px; color: var(--muted); background: rgba(16,24,39,.8); padding: 4px 8px; border-radius: 4px; }
  .tiny { font: 600 12px/1 inherit; color: var(--ink); background: var(--plate); border: 1px solid var(--edge); border-radius: 4px; padding: 7px 10px; cursor: pointer; }
  #objective { position: fixed; left: 50%; top: 40px; transform: translateX(-50%); max-width: calc(100% - 24px); font-size: 15px; font-weight: 700; color: var(--focus); background: rgba(16,24,39,.9); border: 2px solid var(--gold); border-radius: 4px; padding: 8px 14px; z-index: 2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #objective.retry { border-color: var(--red); color: #FFD0A1; }
  #netStatus { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); font-size: 13px; color: var(--focus); background: rgba(16,24,39,.9); border: 1px solid var(--edge); border-radius: 4px; padding: 6px 12px; z-index: 2; }
  #debug { position: fixed; left: 8px; bottom: 8px; margin: 0; font: 11px/1.4 monospace; color: #9fffa8; background: rgba(10,15,26,.85); padding: 6px 8px; border-radius: 4px; z-index: 2; white-space: pre; }
  .keys { font-size: 12px; color: var(--muted); text-align: center; margin: 8px 0 0; }
</style>
</head>
<body>
  <!-- 主選單 -->
  <section class="screen" id="menu" hidden>
    <div class="panel">
      <h1>拳刃交鋒</h1>
      <p class="sub">七格浮空擂台・猜拳讀心・連打收頭</p>
      <button class="btn hot" data-go="tutorial"><b>互動教學道場</b><small>四關微教學：走位、讀心、連打彈反、閃紅招</small></button>
      <button class="btn" data-go="difficulty"><b>單人對戰 AI</b><small>新手木樁／道場師兄／讀心宗師</small></button>
      <button class="btn" data-go="local2p"><b>同機雙人（Local 2P）</b><small>P1 A／S／D　P2 J／K／L</small></button>
      <button class="btn" data-go="online"><b>線上對戰</b><small>建立房間，或輸入 4 碼房號加入</small></button>
      <p class="keys">左鍵＝石頭／往左　中鍵＝剪刀／鎖定　右鍵＝布／往右　｜　Esc 回大廳　` 除錯資訊</p>
    </div>
  </section>

  <!-- AI 難度 -->
  <section class="screen" id="difficulty" hidden>
    <div class="panel">
      <button class="back" data-go="menu">← 回大廳</button>
      <button class="btn" data-go="ai:easy"><b>新手木樁</b><small>反應慢、連打慢、很少開紅招</small></button>
      <button class="btn" data-go="ai:mid"><b>道場師兄</b><small>看你站崖邊又 80% 以上，就開紅招收頭</small></button>
      <button class="btn" data-go="ai:master"><b>讀心宗師</b><small>前搖假動作、最後藏招變拳、留 2 氣等你</small></button>
    </div>
  </section>

  <!-- 線上 -->
  <section class="screen" id="online" hidden>
    <div class="panel">
      <button class="back" data-go="menu">← 回大廳</button>
      <button class="btn" data-go="create"><b>建立房間</b><small>產生 4 碼房號，把網址傳給朋友</small></button>
      <div class="row"><input class="code" id="roomInput" maxlength="4" placeholder="房號" autocomplete="off" aria-label="4 碼房號"><button class="btn" data-go="join" style="flex:none"><b>加入</b></button></div>
      <p class="err" id="roomError"></p>
      <p class="link" id="roomLink"></p>
      <p class="keys">連線後端下一步補上：目前畫面與 WebSocketTransport 骨架已就緒</p>
    </div>
  </section>

  <!-- 遊戲 -->
  <section class="screen" id="game" hidden>
    <canvas id="screen" aria-label="拳刃交鋒 遊戲畫面"></canvas>
    <div class="bar">
      <span class="tag" id="modeTag"></span>
      <span class="row"><button class="tiny" id="skipTut" data-go="skip" hidden>跳過教學</button><button class="tiny" data-go="menu">回大廳</button></span>
    </div>
    <div id="objective" hidden></div>
    <div id="netStatus" hidden></div>
    <pre id="debug" hidden></pre>
  </section>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
