<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拳刃交鋒｜同機雙人原型</title>
<style>
  :root { --bg: #0A0F1A; --bar: #101827; --ink: #F4F3EE; --muted: #8592A4; --gold: #F4D58C; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; overflow: hidden; }
  #wrap { position: fixed; inset: 0 0 52px 0; display: grid; place-items: center; }
  canvas#screen { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; height: 52px; display: flex; gap: 6px; align-items: center; justify-content: center; padding: 6px 10px; background: var(--bar); border-top: 1px solid #243249; flex-wrap: nowrap; overflow-x: auto; }
  #bar button { flex: none; font: 600 13px/1 inherit; color: var(--ink); background: #1C2B41; border: 1px solid #394B61; border-radius: 6px; padding: 9px 12px; cursor: pointer; }
  #bar button:hover { background: #243249; }
  #bar button.on { border-color: var(--gold); color: var(--gold); }
  #bar .hint { flex: none; font-size: 11px; color: var(--muted); margin-left: 6px; white-space: nowrap; }
</style>
</head>
<body>
<div id="wrap"><canvas id="screen" aria-label="拳刃交鋒 遊戲畫面"></canvas></div>
<div id="bar">
  <button data-sc="0">場景 1：中央對峙</button>
  <button data-sc="1">場景 2：崖邊二連走位</button>
  <button data-sc="2">場景 3：零力量閃紅招</button>
  <span class="hint">P1：A／S／D　P2：J／K／L　｜　` 除錯資訊　｜　空白鍵：結束後重開</span>
</div>
<script>
"use strict";
/* =====================================================================
   拳刃交鋒（Local 2P 原型）
   結構：ART（美術規格 art_spec.json 原樣內嵌）→ CONFIG（玩法數值）→ Sfx → Input → Game（五階段狀態機）
        → Renderer（像素武者：程式繪製；有 Sprite Sheet 就照 ART.spriteAtlas 切格）→ 畫面（照聖經的繪製順序）→ 主迴圈
   頓幀只停「演出」（角色動畫、命中特效、擊飛飛行）；倒數與輸入照常進行（美術聖經 §4）
   ===================================================================== */

      { "minInclusive": 100, "maxInclusive": null, "fill": "#E05266", "topRim": "#FFD7D9", "smoke": true, "smokeColor": "#7D374D" }
    ],

  },
  "hud": {
    "safeMarginPx": { "x": 16, "y": 12 },
    "playerPanels": { "p1": { "anchorX": 16, "anchorY": 12, "align": "left" }, "p2": { "anchorX": 464, "anchorY": 12, "align": "right" }, "damageFontPx": 24, "stockCount": 3, "stockSizePx": [8, 8], "powerCount": 3, "powerSizePx": [11, 5], "iconGapPx": 3 },
    "keyRow": { "centerX": 240, "topY": 232, "keySizePx": [30, 25], "gapPx": 5, "glyphSizePx": [14, 14], "rowsFacing": "screen", "slotOrder": ["left", "center", "right"],
      "iconsByPhase": { "step": ["left_arrow", "inactive", "right_arrow"], "standoff": ["rock", "scissors", "paper"], "hidden_commit": ["rock", "scissors", "paper"], "combo": ["inactive", "inactive", "inactive"], "finisher_select": ["rock", "scissors", "paper"], "blue_parry": ["rock", "scissors", "paper"], "red_roll": ["left_arrow", "inactive", "right_arrow"], "resolution": ["inactive", "inactive", "inactive"] } }
  },

    "redRoll": { "cueDurationSuggestedMs": 500, "hazardShape": "diagonal_hatch", "hazardAnchor": "stage_tile", "safeArrowAnchor": "defender_foot", "safeArrowOffsetAbsPx": [14, -7], "safeArrowSizePx": [12, 10], "hazardFillOpacity": 0.44, "hazardHatchPeriodPx": 6, "hazardHatchStepMs": 80, "timerStyle": "horizontal_deplete", "hazardTilesLockedAtCue": true }
  },
  "effects": {

    "impactFrameFlash": { "targetOnly": true, "durationMs": 33, "maxOpacity": 0.76 },
    "parryFlash": { "localOnly": true, "durationMs": 42, "maxOpacity": 0.8 },

    "damageSmoke": { "maxPuffsPerPlayer": 3, "maxHeightPx": 8, "maxOpacity": 0.4 },
    "reducedMotion": { "cameraShakeMultiplier": 0, "flashOpacityMultiplier": 0, "trailMaxAfterimages": 1, "staticTelegraphHatching": true, "keepCountdownAndSignals": true }
  },
  "spriteAtlas": {
    "imageByPlayer": { "p1": "fighter_p1.png", "p2": "fighter_p2.png" },
    "imageWidth": 500, "imageHeight": 800, "columns": 10, "rows": 16, "frameWidth": 48, "frameHeight": 48, "strideX": 50, "strideY": 50, "originX": 1, "originY": 1,
    "pivot": { "x": 24, "y": 40 }, "baseFacing": "right", "mirrorForLeft": true, "alphaBackground": true, "frameIndexBase": 0,
    "stateOrder": ["idle", "step", "exhausted", "stance_rock", "stance_scissors", "stance_paper", "stance_hidden", "clash", "combo_1", "combo_2", "finisher_blue", "finisher_red", "parry_success", "roll", "hitstun", "knockback"],
    "animations": {
      "idle": { "row": 0, "frames": 6, "fps": 10, "playback": "loop", "keyFrames": { "neutral": 0, "inhalePeak": 3 } },
      "step": { "row": 1, "frames": 5, "fps": 24, "playback": "hold_last", "keyFrames": { "pushOff": 1, "plant": 3 } },
      "exhausted": { "row": 2, "frames": 6, "fps": 12, "playback": "hold_last", "keyFrames": { "brake": 0, "gasp": 2, "readyPose": 5 } },
      "stance_rock": { "row": 3, "frames": 4, "fps": 12, "playback": "loop", "keyFrames": { "readablePose": 0 } },
      "stance_scissors": { "row": 4, "frames": 4, "fps": 12, "playback": "loop", "keyFrames": { "readablePose": 0 } },
      "stance_paper": { "row": 5, "frames": 4, "fps": 12, "playback": "loop", "keyFrames": { "readablePose": 0 } },
      "stance_hidden": { "row": 6, "frames": 4, "fps": 8, "playback": "hold_last", "keyFrames": { "fullyMasked": 0 } },
      "clash": { "row": 7, "frames": 5, "fps": 24, "playback": "event_driven", "keyFrames": { "contact": 1, "recoil": 3 }, "anchors": { "contact": [37, 20] } },
      "combo_1": { "row": 8, "frames": 5, "fps": 24, "playback": "event_driven", "keyFrames": { "contact": 2, "recovery": 4 }, "anchors": { "contact": [39, 24] } },
      "combo_2": { "row": 9, "frames": 6, "fps": 24, "playback": "event_driven", "keyFrames": { "contact": 3, "recovery": 5 }, "anchors": { "contact": [41, 20] } },
      "finisher_blue": { "row": 10, "frames": 10, "fps": 16, "playback": "event_driven", "keyFrames": { "cue": 0, "windupLast": 7, "contact": 8, "recovery": 9 }, "anchors": { "contact": [42, 23] } },
      "finisher_red": { "row": 11, "frames": 10, "fps": 16, "playback": "event_driven", "keyFrames": { "cue": 0, "windupLast": 7, "contact": 8, "recovery": 9 }, "anchors": { "contact": [40, 32] } },
      "parry_success": { "row": 12, "frames": 6, "fps": 24, "playback": "event_driven", "keyFrames": { "contact": 0, "brace": 1, "crossStep": 3, "settle": 5 }, "anchors": { "contact": [35, 22] } },
      "roll": { "row": 13, "frames": 6, "fps": 24, "playback": "hold_last", "keyFrames": { "duck": 0, "tuck": 2, "land": 4, "recover": 5 } },
      "hitstun": { "row": 14, "frames": 4, "fps": 20, "playback": "hold_last", "keyFrames": { "recoil": 0, "stagger": 2 } },
      "knockback": { "row": 15, "frames": 6, "fps": 18, "playback": "tail_loop", "loopStartFrame": 2, "keyFrames": { "launch": 0, "tumbleStart": 2 } }
    }
  }
};

// ===================== CONFIG：玩法數值（試玩後只改這裡） =====================
const CONFIG = {
  W: ART.canvas.width, H: ART.canvas.height,
  cells: ART.stage.tileCount, cellW: ART.stage.tileWidthPx, stageX: ART.stage.leftX, floorY: ART.stage.surfaceY,
  stocks: 3, powerMax: 3, powerStart: 2,
  spawn: [3, 5],                          // 掉命後重置的格子（P1、P2）

  move: { dur: 1.2, maxSteps: 2, stepTime: 0.16, bumpTime: 0.22, secondStepStun: 1.0, wobbleTime: 0.3 },
  rps: { dur: 1.8, reveal: 1.3 },         // 前 1.3s 亮招、後 0.5s 藏招
  clash: { dur: 0.75 },
  combo: { dur: 0.9, hitTimes: [0.18, 0.48], hitDamage: 12, chargeTime: 0.35, redCost: 2 },
  finisher: { dur: 0.5, hitDamage: 20 },
  parry: { counterDamage: 15, counterKnock: 1 },
  roll: { cells: 2, time: 0.28 },
  resolve: {
    minDur: 0.6,
    vBase: 150,                           // 擊飛速度 V = vBase × (1 + damage / damageDiv)，紅招再 × redMult
    damageDiv: 60,
    redMult: 1.45,
    angleDeg: 48,
    gravity: 900,
    koMargin: 26,                         // 飛出畫面多少像素算場外擊落
    koPause: 0.9,
  },
  // 倒數提示（比美術規格再明顯一點）：最後 urgentSec 秒變紅閃、每 0.1 秒一聲嗒
  countdown: { urgentSec: 0.15, tickEvery: 0.1, phaseTickLast: 0.3, bigBarW: 160 },
  feel: { zoomCombo: 1.12, zoomLerp: 8 },  // 鏡頭推近只在連轟（終結提示出現時鏡頭回穩，規格 §4）；設 1 就關掉

  keys: { p1: { KeyA: "L", KeyS: "M", KeyD: "R" }, p2: { KeyJ: "L", KeyK: "M", KeyL: "R" } },
  keyLabel: [{ L: "A", M: "S", R: "D" }, { L: "J", M: "K", R: "L" }],
  gestureOf: { L: "rock", M: "scissors", R: "paper" },   // 左=石頭 中=剪刀 右=布
  names: ["P1 赭鋒", "P2 翠嵐"],
  skin: "#E6B48A",                        // 臉與手（美術規格未列，取中性暖膚色）

  scenarios: [
    { name: "場景 1：中央對峙", p: [{ pos: 3, power: 2, damage: 0 }, { pos: 5, power: 2, damage: 0 }] },
    { name: "場景 2：崖邊二連走位", p: [{ pos: 5, power: 2, damage: 0 }, { pos: 7, power: 2, damage: 90 }] },
    { name: "場景 3：零力量閃紅招", p: [{ pos: 6, power: 2, damage: 0 }, { pos: 7, power: 0, damage: 110 }] },
  ],
};
const PAL = ART.palette, FX = ART.effects;
const REDUCED = typeof matchMedia !== "undefined" && matchMedia("(prefers-reduced-motion: reduce)").matches;
const ms = v => v / 1000;

const GLABEL = { rock: "石", scissors: "剪", paper: "布" };
const BEATS = { rock: "scissors", scissors: "paper", paper: "rock" };          // 誰贏誰
const COUNTER = { rock: "paper", scissors: "rock", paper: "scissors" };        // 克制這招的手勢
const KEY_OF = { rock: "L", scissors: "M", paper: "R" };
const cellX = i => CONFIG.stageX + (i - 0.5) * CONFIG.cellW;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

// ===================== Sfx：Web Audio 合成音效 =====================
const Sfx = (() => {
  let ac = null, master = null, noiseBuf = null, hum = null;
  function unlock() {
    if (ac) { if (ac.state === "suspended") ac.resume(); return; }
    const A = window.AudioContext || window.webkitAudioContext;
    if (!A) return;
    ac = new A();
    master = ac.createGain(); master.gain.value = 0.55; master.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const ok = () => ac && ac.state === "running";
  function env(g, t, peak, a, dcy) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + dcy); }
  function tone(freq, dur, vol, type = "sine", drop = 1, at = 0) {
    if (!ok()) return;
    const t = ac.currentTime + at, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (drop !== 1) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * drop), t + dur);
    env(g, t, vol, 0.004, dur); o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, vol, freq, type = "bandpass", q = 1, at = 0, sweep = 0) {
    if (!ok()) return;
    const t = ac.currentTime + at, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (sweep) f.frequency.exponentialRampToValueAtTime(sweep, t + dur);
    env(g, t, vol, 0.003, dur); s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random() * 0.5, dur + 0.05);
  }
  return {
    unlock,
    tick() { tone(1600, 0.03, 0.05, "square"); },
    count(urgent) { tone(urgent ? 1320 : 990, 0.045, urgent ? 0.13 : 0.08, "square"); },   // 倒數嗒聲
    hide() { noise(0.18, 0.12, 2400, "bandpass", 1, 0, 600); },
    deny() { tone(180, 0.08, 0.08, "square", 0.8); },
    step() { noise(0.05, 0.12, 900, "lowpass"); tone(120, 0.06, 0.12, "sine", 0.6); },
    wobble() { tone(520, 0.08, 0.05, "triangle", 1.3); },
    bump() { tone(90, 0.12, 0.3, "sine", 0.5); noise(0.06, 0.2, 700, "lowpass"); },
    clash() { tone(1850, 0.35, 0.16, "triangle", 0.97); tone(2770, 0.28, 0.1, "sine", 0.99); noise(0.12, 0.35, 5200, "bandpass", 2); tone(140, 0.12, 0.25, "sine", 0.5); },
    punch(power = 1) { tone(110 - 20 * power, 0.14, 0.45 * power, "sine", 0.4); noise(0.07, 0.4 * power, 1200, "lowpass"); noise(0.02, 0.2, 3800, "bandpass", 3); },
    heavy() { tone(70, 0.3, 0.6, "sine", 0.35); noise(0.18, 0.5, 600, "lowpass"); noise(0.03, 0.3, 3000, "bandpass", 2); },
    parry() { tone(2350, 0.45, 0.22, "triangle"); tone(3520, 0.35, 0.12, "sine"); tone(1175, 0.2, 0.1, "square", 1, 0.02); noise(0.05, 0.3, 6000, "highpass"); },
    whoosh() { noise(0.22, 0.2, 800, "bandpass", 0.8, 0, 3200); },
    chargeStart() {
      if (!ok() || hum) return;
      const t = ac.currentTime, o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain();
      o.type = "sawtooth"; o2.type = "sine"; o.frequency.setValueAtTime(55, t); o.frequency.linearRampToValueAtTime(95, t + 0.35); o2.frequency.setValueAtTime(110, t);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.14, t + 0.1);
      const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 500;
      o.connect(f); o2.connect(f); f.connect(g); g.connect(master); o.start(t); o2.start(t);
      hum = { o, o2, g };
    },
    chargeStop() { if (!hum) return; const t = ac.currentTime; hum.g.gain.cancelScheduledValues(t); hum.g.gain.setValueAtTime(hum.g.gain.value, t); hum.g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08); hum.o.stop(t + 0.1); hum.o2.stop(t + 0.1); hum = null; },
    redReady() { tone(60, 0.5, 0.35, "sawtooth", 1.6); noise(0.3, 0.2, 300, "lowpass"); },
    ko() { tone(55, 0.9, 0.7, "sine", 0.3); noise(0.8, 0.6, 400, "lowpass", 0.7, 0, 80); noise(0.25, 0.4, 2500, "bandpass", 1); tone(880, 0.6, 0.08, "triangle", 0.5, 0.05); },
    land() { noise(0.06, 0.18, 500, "lowpass"); tone(90, 0.08, 0.15, "sine", 0.6); },
  };
})();

// ===================== Input：放開再按＋判定窗單次鎖死 =====================
//   · 只認「新的按下」：鍵盤自動重複一律忽略
//   · 進入新階段（Input.phaseReset）時，所有還按著的鍵標為 stale：要放開再按才算數；上一階段沒處理的事件全部丟掉
//   · held() 只看沒被標 stale 的鍵（長按蓄力用）
const Input = (() => {
  const keys = {}, queue = [];
  const owner = code => { for (const [p, map] of [[0, CONFIG.keys.p1], [1, CONFIG.keys.p2]]) if (map[code]) return { p, btn: map[code] }; return null; };
  const k = code => (keys[code] ??= { down: false, stale: false });
  addEventListener("keydown", e => {
    if (e.code === "Backquote") { Game.debug = !Game.debug; return; }
    if (e.code === "Space") { Sfx.unlock(); if (Game.phase === "GAMEOVER") Game.loadScenario(Game.scenario); e.preventDefault(); return; }
    const o = owner(e.code);
    if (!o) return;
    e.preventDefault();
    Sfx.unlock();
    if (e.repeat) return;
    const s = k(e.code);
    if (s.down) return;
    s.down = true; s.stale = false;
    queue.push({ type: "down", p: o.p, btn: o.btn });
  });
  addEventListener("keyup", e => {
    const o = owner(e.code);
    if (!o) return;
    const s = k(e.code);
    s.down = false; s.stale = false;
    queue.push({ type: "up", p: o.p, btn: o.btn });
  });
  addEventListener("blur", () => { for (const c in keys) { keys[c].down = false; keys[c].stale = true; } queue.length = 0; });
  const mapOf = p => (p === 0 ? CONFIG.keys.p1 : CONFIG.keys.p2);
  const codeOf = (p, btn) => Object.keys(mapOf(p)).find(c => mapOf(p)[c] === btn);
  return {
    drain() { return queue.splice(0, queue.length); },
    phaseReset() { for (const c in keys) if (keys[c].down) keys[c].stale = true; queue.length = 0; },
    held(p, btn) { const s = keys[codeOf(p, btn)]; return !!s && s.down && !s.stale; },
    raw(p, btn) { const s = keys[codeOf(p, btn)]; return s ? (s.stale ? "stale" : s.down ? "down" : "up") : "up"; },
  };
})();

// ===================== Game：五階段狀態機 =====================
const PH = { MOVE: "MOVE", RPS: "RPS", CLASH: "CLASH", COMBO: "COMBO", FINISHER: "FINISHER", RESOLVE: "RESOLVE", GAMEOVER: "GAMEOVER" };
const PH_LABEL = { MOVE: "走位", RPS: "猜拳對峙", CLASH: "拼刀！", COMBO: "連轟", FINISHER: "終結判定", RESOLVE: "結算", GAMEOVER: "比賽結束" };

const Game = {
  phase: PH.MOVE, t: 0, rt: 0, dur: 1, debug: false, scenario: 0,
  f: [], freeze: 0, fx: [], log: [], round: null, winner: -1,
  shake: { amp: 0, t: 0 }, cam: { zoom: 1, target: 1, x: CONFIG.W / 2, y: CONFIG.H / 2 },
  lastTick: -1, keyFlash: { L: 0, M: 0, R: 0 }, committed: [false, false],

  makeFighter(i, s) {
    return {
      i, pos: s.pos, power: s.power, damage: s.damage, stocks: CONFIG.stocks,
      stun: 0, steps: 0, locked: false, move: null, wobble: 0, deny: 0,
      stance: null, x: cellX(s.pos), y: CONFIG.floorY, vx: 0, vy: 0, air: false, rot: 0,
      face: i === 0 ? 1 : -1, anim: { state: "idle", t: 0 }, trail: [], trailClock: 0, trailOn: false,
      out: false, offX: 0, gl: null, flashT: 0, rimT: 0, fin: 0,
    };
  },
  loadScenario(n) {
    this.scenario = n;
    const sc = CONFIG.scenarios[n];
    this.f = [this.makeFighter(0, sc.p[0]), this.makeFighter(1, sc.p[1])];
    this.fx = []; this.freeze = 0; this.winner = -1; this.shake = { amp: 0, t: 0 }; this.round = null;
    delete this.koTimer;
    this.banner(sc.name, PAL.hud.focusOutline);
    this.enter(PH.MOVE);
    document.querySelectorAll("#bar button").forEach(b => b.classList.toggle("on", Number(b.dataset.sc) === n));
  },
  other(f) { return this.f[1 - f.i]; },
  setAnim(f, st) { if (f.anim.state !== st) f.anim = { state: st, t: 0 }; },
  note(m) { this.log.push(`${this.phase} ${this.t.toFixed(2)} ${m}`); if (this.log.length > 12) this.log.shift(); },

  // 給畫面的提示資料（美術聖經 §7：phase、cueAt、deadlineAt、attackerId、defenderId、手勢、危險格、安全方向）
  cue() {
    const r = this.round;
    if (this.phase !== PH.FINISHER || !r) return null;
    return { phase: this.phase, kind: r.type, cueAt: r.cueAt, deadlineAt: r.cueAt + CONFIG.finisher.dur, now: this.rt, attackerId: r.att, defenderId: r.def, gesture: r.gesture, dangerTiles: r.zone ?? [], safeDirs: r.dirs ?? [], done: r.done };
  },

  enter(ph) {
    this.phase = ph; this.t = 0; this.lastTick = -1;
    Input.phaseReset();                                   // 跨階段：還按著的鍵要放開再按
    const [a, b] = this.f;
    if (ph === PH.MOVE) {
      this.dur = CONFIG.move.dur; this.cam.target = 1;
      for (const f of this.f) { f.steps = 0; f.locked = false; f.stance = null; f.trailOn = false; if (!f.move) this.setAnim(f, f.stun > 0 || f.power <= 0 ? "exhausted" : "idle"); }
    } else if (ph === PH.RPS) {
      this.dur = CONFIG.rps.dur; this.committed = [false, false];
      for (const f of this.f) { f.stance = null; f.picked = false; }
    } else if (ph === PH.CLASH) {
      this.dur = CONFIG.clash.dur;
      for (const f of this.f) this.setAnim(f, "clash");
      const mx = (a.x + b.x) / 2;
      this.hit("clash");
      this.spark(mx, CONFIG.floorY - 24, PAL.fx.impact.spark, 5, 2.2, true);
      this.popup(mx, CONFIG.floorY - 64, "拼刀！", PAL.fx.impact.core, 14);
      Sfx.clash();
    } else if (ph === PH.COMBO) {
      this.dur = CONFIG.combo.dur;
      const r = this.round;
      r.hits = 0; r.gesture = r.winGesture; r.red = false; r.charging = false; r.chargeStart = 0;
      this.cam.target = CONFIG.feel.zoomCombo;
    } else if (ph === PH.FINISHER) {
      this.dur = CONFIG.finisher.dur;
      const r = this.round, att = this.f[r.att], def = this.f[r.def];
      r.done = false; r.type = r.red ? "red" : "blue"; r.cueAt = this.rt;
      att.stance = r.red ? "rock" : r.gesture;               // 終結手勢＝武器（紅招一律巨錘重砸）
      att.fin = 0;
      r.away = Math.sign(def.pos - att.pos) || 1;
      if (r.red) {                                          // 危險格在提示亮起時鎖定、到收招都不變
        r.zone = [def.pos, def.pos + r.away].filter(c => c >= 1 && c <= CONFIG.cells);
        r.dirs = [-1, 1].filter(d => { const to = def.pos + d * CONFIG.roll.cells; return to >= 1 && to <= CONFIG.cells && to !== att.pos; });
        this.setAnim(att, "finisher_red");
      } else { r.zone = []; r.dirs = []; this.setAnim(att, "finisher_blue"); }
      this.setAnim(def, "idle");
      this.cam.target = 1;                                  // 提示出現：鏡頭回穩
    } else if (ph === PH.RESOLVE) {
      this.dur = CONFIG.resolve.minDur; this.cam.target = 1;
    } else if (ph === PH.GAMEOVER) {
      this.dur = 0; this.cam.target = 1;
    }
    this.note(`進入 ${ph}`);
  },

  // ---------- 主更新（固定步長）：邏輯一定跑；頓幀只停演出 ----------
  update(dt) {
    this.rt += dt;
    const evs = Input.drain();
    this.t += dt;
    const frozen = this.freeze > 0;
    if (frozen) this.freeze = Math.max(0, this.freeze - dt);
    const vdt = frozen ? 0 : dt;                          // 演出時間：頓幀時停住
    for (const f of this.f) {
      f.anim.t += vdt;
      if (f.stun > 0) f.stun = Math.max(0, f.stun - dt);  // 第二步硬直：真實時間、跨階段
      if (f.wobble > 0) f.wobble = Math.max(0, f.wobble - dt);
      if (f.deny > 0) f.deny = Math.max(0, f.deny - dt);
      f.flashT = Math.max(0, f.flashT - dt); f.rimT = Math.max(0, f.rimT - dt);
      this.updateMove(f, dt);
      this.updateGlide(f, vdt);
      f.offX *= Math.pow(0.0005, vdt);
      this.updateTrail(f, vdt);
    }
    for (const f of this.f) { const o = this.other(f); if (!f.air && !f.out && !f.gl) f.face = Math.sign(o.x - f.x) || f.face; }
    for (const k in this.keyFlash) this.keyFlash[k] = Math.max(0, this.keyFlash[k] - dt);
    for (const e of evs) if (e.type === "down") this.keyFlash[e.btn] = 0.12;
    this.countdownTicks();
    const fn = this["upd" + this.phase];
    if (fn) fn.call(this, dt, evs, vdt);
    this.updateFx(vdt, dt);
    this.updateCam(dt);
  },
  // 倒數嗒聲：終結判定窗每 0.1 秒一聲；走位／猜拳最後 0.3 秒；猜拳進藏招一聲
  countdownTicks() {
    const C = CONFIG.countdown, left = this.dur - this.t;
    if (this.phase === PH.FINISHER && this.round && !this.round.done) {
      const n = Math.ceil(left / C.tickEvery);
      if (n !== this.lastTick && n >= 1) { this.lastTick = n; Sfx.count(left <= C.urgentSec + 0.05); }
    } else if ((this.phase === PH.MOVE || this.phase === PH.RPS) && left <= C.phaseTickLast + 1e-6 && left > 0) {
      const n = Math.ceil(left / C.tickEvery);
      if (n !== this.lastTick) { this.lastTick = n; Sfx.count(n === 1); }
    }
  },

  // ---------- PHASE_MOVE ----------
  updMOVE(dt, evs) {
    for (const e of evs) {
      if (e.type !== "down") continue;
      const f = this.f[e.p];
      if (e.btn === "M") { if (!f.locked) { f.locked = true; Sfx.tick(); this.popup(f.x, CONFIG.floorY - 58, "鎖定", PAL.hud.muted, 8); } continue; }
      this.tryStep(f, e.btn === "L" ? -1 : 1);
    }
    if (this.t >= this.dur) this.enter(PH.RPS);
  },
  tryStep(f, dir) {
    const C = CONFIG.move;
    if (f.locked || f.move || f.steps >= C.maxSteps) { f.deny = 0.25; Sfx.deny(); return; }
    const to = f.pos + dir;
    if (to < 1 || to > CONFIG.cells) { f.wobble = C.wobbleTime; f.wobbleDir = dir; Sfx.wobble(); return; }   // 崖邊：踩空微晃，不扣氣不計步
    if (f.power < 1) { f.deny = 0.4; Sfx.deny(); this.popup(f.x, CONFIG.floorY - 58, "沒氣了", "#FFAA63", 8); return; }
    f.power -= 1; f.steps += 1;
    const o = this.other(f), om = o.move;
    let bump = false;
    if (om && !om.bump && (om.to === to || (om.to === f.pos && to === om.from))) {   // 同時踏進同一格／互相穿過：雙方頂撞彈回
      bump = true;
      o.move = { from: om.from, to: om.to, t: 0, dur: C.bumpTime, bump: true, second: om.second };
    } else if (o.pos === to) bump = true;                                             // 踏進對方站著的格子：彈回
    f.move = { from: f.pos, to, t: 0, dur: bump ? C.bumpTime : C.stepTime, bump, second: f.steps === C.maxSteps };
    this.setAnim(f, "step");
    if (bump) {
      const mx = (cellX(f.pos) + cellX(to)) / 2 + (o.pos === to ? -Math.sign(dir) * CONFIG.cellW * 0.3 : 0);
      this.spark(mx, CONFIG.floorY - 22, PAL.fx.impact.spark, 4, 1.6, true); Sfx.bump(); this.shakeKick(1, 0.06);
      this.popup(mx, CONFIG.floorY - 52, "頂撞！", PAL.fx.impact.spark, 9);
    } else Sfx.step();
    this.note(`P${f.i + 1} 走 ${dir > 0 ? "右" : "左"} → ${to}${bump ? "（頂撞彈回）" : ""}`);
  },
  updateMove(f, dt) {
    const m = f.move;
    if (!m) return;
    m.t += dt;
    const k = clamp(m.t / m.dur, 0, 1);
    if (m.bump) f.x = lerp(cellX(m.from), cellX(m.to), 0.42 * Math.sin(Math.PI * k));
    else f.x = lerp(cellX(m.from), cellX(m.to), 1 - Math.pow(1 - k, 2));
    f.y = CONFIG.floorY - Math.sin(Math.PI * k) * (m.bump ? 3 : 5);
    if (k >= 1) {
      if (!m.bump) f.pos = m.to;
      f.x = cellX(f.pos); f.y = CONFIG.floorY; f.move = null;
      if (m.second) { f.stun = CONFIG.move.secondStepStun; this.note(`P${f.i + 1} 第二步落地：硬直 ${CONFIG.move.secondStepStun}s`); }   // 第二步落地起算硬直
      if (this.phase === PH.MOVE || this.phase === PH.RPS) this.setAnim(f, f.stun > 0 || f.power <= 0 ? "exhausted" : "idle");   // 硬直：彎腰喘氣
    }
  },

  // ---------- PHASE_RPS ----------
  updRPS(dt, evs) {
    const hidden = this.t >= CONFIG.rps.reveal;
    for (const e of evs) {
      if (e.type !== "down") continue;
      const f = this.f[e.p];
      if (f.stun > 0) { f.deny = 0.3; Sfx.deny(); continue; }       // 硬直：按鍵反灰鎖死
      f.stance = CONFIG.gestureOf[e.btn]; f.picked = true; this.committed[f.i] = true; Sfx.tick();
    }
    if (hidden && !this.hidSound) { this.hidSound = true; Sfx.hide(); for (const f of this.f) f.trail = []; }   // 藏招第一幀：清掉上一架式的殘影
    if (!hidden) this.hidSound = false;
    for (const f of this.f) if (!f.move) this.setAnim(f, hidden ? "stance_hidden" : f.stance ? "stance_" + f.stance : f.stun > 0 ? "exhausted" : "idle");
    if (this.t >= this.dur) {
      for (const f of this.f) if (!f.stance) { f.stance = ["rock", "scissors", "paper"][Math.floor(Math.random() * 3)]; f.random = true; } else f.random = false;
      const [a, b] = this.f;
      for (const f of this.f) { this.setAnim(f, "stance_" + f.stance); this.popup(f.x, CONFIG.floorY - 66, GLABEL[f.stance] + (f.random ? "（隨機）" : ""), PAL.fighters["p" + (f.i + 1)].secondary, 12); }
      this.note(`出拳 P1=${a.stance} P2=${b.stance}`);
      if (a.stance === b.stance) { this.enter(PH.CLASH); return; }
      const w = BEATS[a.stance] === b.stance ? 0 : 1;
      this.round = { att: w, def: 1 - w, winGesture: this.f[w].stance, winKey: KEY_OF[this.f[w].stance] };
      this.enter(PH.COMBO);
    }
  },

  // ---------- 拼刀 ----------
  updCLASH(dt) {
    const [a, b] = this.f, k = this.t / this.dur;
    a.offX = -Math.sin(Math.PI * k) * 6; b.offX = Math.sin(Math.PI * k) * 6;
    if (this.t >= this.dur) { a.offX = b.offX = 0; this.enter(PH.MOVE); }      // 平手：不回力量，直接回走位
  },

  // ---------- PHASE_COMBO ----------
  updCOMBO(dt, evs) {
    const r = this.round, att = this.f[r.att], def = this.f[r.def], C = CONFIG.combo;
    // 終結選擇（只認攻方、只認放開後重新按下的鍵）
    for (const e of evs) {
      if (e.p !== r.att || r.red) continue;
      if (e.type === "down") {
        if (e.btn === r.winKey && att.power >= C.redCost) { r.charging = true; r.chargeStart = this.rt; r.gesture = CONFIG.gestureOf[e.btn]; Sfx.chargeStart(); }
        else { r.charging = false; Sfx.chargeStop(); r.gesture = CONFIG.gestureOf[e.btn]; Sfx.tick(); }
        r.chosen = true;
      } else if (e.type === "up" && r.charging && e.btn === r.winKey) {
        r.charging = false; Sfx.chargeStop();                 // 未滿 0.35s 放開：普通終結、不扣氣
      }
    }
    if (r.charging && Input.held(r.att, r.winKey) && this.rt - r.chargeStart >= C.chargeTime) {
      r.charging = false; r.red = true; att.power -= C.redCost; Sfx.chargeStop(); Sfx.redReady();
      this.popup(att.x, CONFIG.floorY - 70, "強化紅招！", PAL.fx.red.rim, 12); this.shakeKick(2, 0.1);
      this.note(`P${att.i + 1} 蓄力完成：紅招（扣 ${C.redCost} 氣）`);
    }
    // 自動兩連擊
    while (r.hits < C.hitTimes.length && this.t >= C.hitTimes[r.hits]) {
      r.hits++;
      const ev = r.hits === 1 ? "combo_1" : "combo_2";
      this.setAnim(att, ev);
      this.setAnim(def, "hitstun");
      def.damage += C.hitDamage;
      const away = Math.sign(def.pos - att.pos) || 1, to = def.pos + away;
      if (to >= 1 && to <= CONFIG.cells) def.pos = to;     // 撞到崖邊強制停住
      this.glide(def, 0.1, 2);
      att.offX = Math.sign(def.x - att.x) * 8;
      att.trailOn = r.hits === 2;                           // 二連擊用殘影接上
      def.flashT = ms(FX.impactFrameFlash.durationMs);      // 受擊方一拍輪廓反白
      this.hit(ev);
      Sfx.punch(r.hits === 1 ? 0.8 : 1);
      this.spark(def.x - away * 8, CONFIG.floorY - 24, PAL.fx.impact.spark, 6, 2.2, true);
      this.popup(def.x, CONFIG.floorY - 60, `+${C.hitDamage}%`, PAL.fx.impact.core, 10);
      this.note(`第 ${r.hits} 擊 P${def.i + 1} → ${def.damage}% 格 ${def.pos}`);
    }
    if (this.t >= this.dur) { Sfx.chargeStop(); r.charging = false; att.trailOn = false; this.enter(PH.FINISHER); }
  },

  // ---------- PHASE_FINISHER（接受區間 cueAt ≤ now < deadlineAt） ----------
  updFINISHER(dt, evs) {
    const r = this.round, def = this.f[r.def];
    if (!r.done) for (const e of evs) {
      if (e.type !== "down" || e.p !== r.def) continue;       // 只有守方、只認第一次按鍵
      r.done = true;
      if (r.type === "blue") {
        if (e.btn === KEY_OF[COUNTER[r.gesture]]) this.parry(); else { this.note(`P${def.i + 1} 按錯（${GLABEL[CONFIG.gestureOf[e.btn]]}）：鎖死吃招`); this.finisherHit(); }
      } else {
        const d = e.btn === "L" ? -1 : e.btn === "R" ? 1 : 0;
        if (d && r.dirs.includes(d)) this.rollOut(d); else { this.note(`P${def.i + 1} 翻滾方向錯：鎖死吃招`); this.finisherHit(); }
      }
      return;
    }
    if (!r.done && this.t >= this.dur) { r.done = true; this.note("判定窗結束：沒反應"); this.finisherHit(); }
  },
  parry() {
    const r = this.round, att = this.f[r.att], def = this.f[r.def];
    r.result = "parry";
    this.hit("parry_success");                             // 頓幀 120ms：完了才演跨身換位（換位由 glide 跟著演出時間走）
    att.rimT = def.rimT = ms(FX.parryFlash.durationMs);    // 兩人短暫亮邊
    Sfx.parry();
    const cx = (att.x + def.x) / 2;
    this.ring(cx, CONFIG.floorY - 24, PAL.fx.impact.core);
    this.popup(def.x, CONFIG.floorY - 72, "完美彈反！", PAL.hud.focusOutline, 14);
    // 互換站位
    [att.pos, def.pos] = [def.pos, att.pos];
    this.setAnim(def, "parry_success");
    // 原守方反打一下重拳：+15%、擊退 1 格（撞到崖邊停住）
    att.damage += CONFIG.parry.counterDamage;
    const away = Math.sign(att.pos - def.pos) || 1;
    const to = clamp(att.pos + away * CONFIG.parry.counterKnock, 1, CONFIG.cells);
    if (to !== def.pos) att.pos = to;
    this.glide(def, 0.18, 8); this.glide(att, 0.24, 6);
    def.trailOn = true; att.trailOn = true;
    att.flashT = ms(FX.impactFrameFlash.durationMs);
    this.setAnim(att, "knockback");
    this.popup(cellX(att.pos), CONFIG.floorY - 56, `+${CONFIG.parry.counterDamage}%`, PAL.fx.impact.core, 10);
    Sfx.punch(1.1);
    this.note(`P${def.i + 1} 完美彈反：互換站位、反擊 P${att.i + 1} → ${att.damage}%`);
    this.enter(PH.RESOLVE);
  },
  rollOut(d) {
    const r = this.round, att = this.f[r.att], def = this.f[r.def];
    r.result = "roll";
    def.pos = def.pos + d * CONFIG.roll.cells;
    this.glide(def, CONFIG.roll.time, 6);
    def.trailOn = true;
    this.setAnim(def, "roll"); Sfx.whoosh();
    att.fin = 1; this.zoneBlast(r.zone);
    this.popup(cellX(def.pos), CONFIG.floorY - 58, "閃過！", PAL.fx.safeArrow.fill, 12);
    this.note(`P${def.i + 1} 翻滾 ${d > 0 ? "▶" : "◀"} 到格 ${def.pos}`);
    this.enter(PH.RESOLVE);
  },
  finisherHit() {
    const r = this.round, att = this.f[r.att], def = this.f[r.def], R = CONFIG.resolve;
    r.result = "hit";
    def.damage += CONFIG.finisher.hitDamage;
    const v = R.vBase * (1 + def.damage / R.damageDiv) * (r.red ? R.redMult : 1);   // V = V_base × (1 + damage / 60)（紅招 × 1.45）
    const a = R.angleDeg * Math.PI / 180;
    def.vx = Math.cos(a) * v * r.away; def.vy = -Math.sin(a) * v; def.air = true; def.rot = 0; def.trailOn = true;
    att.fin = 1;
    this.setAnim(def, "knockback");
    def.flashT = ms(FX.impactFrameFlash.durationMs);
    if (r.red) this.zoneBlast(r.zone);
    this.hit(r.red ? "finisher_red" : "finisher_blue");
    Sfx.heavy();
    this.spark(def.x, CONFIG.floorY - 24, r.red ? PAL.fx.red.core : PAL.fx.impact.spark, r.red ? 12 : 7, 3, true);
    this.popup(def.x, CONFIG.floorY - 64, `+${CONFIG.finisher.hitDamage}%`, r.red ? PAL.fx.red.core : PAL.fx.blue.core, 12);
    this.note(`終結命中 P${def.i + 1} → ${def.damage}%，擊飛速度 ${v.toFixed(0)}`);
    this.enter(PH.RESOLVE);
  },

  // ---------- PHASE_RESOLVE ----------
  updRESOLVE(dt, evs, vdt) {
    const R = CONFIG.resolve;
    for (const f of this.f) {
      if (f.air && !f.out) {                                // 擊飛飛行屬於演出：頓幀時停住
        f.vy += R.gravity * vdt; f.x += f.vx * vdt; f.y += f.vy * vdt; f.rot += f.vx * vdt * 0.05;
        const left = CONFIG.stageX, right = CONFIG.stageX + CONFIG.cells * CONFIG.cellW;
        if (f.y >= CONFIG.floorY && f.vy > 0 && f.x >= left && f.x < right) {   // 落在台上：對齊最近的格子
          f.y = CONFIG.floorY; f.air = false; f.rot = 0; f.trailOn = false;
          let c = clamp(Math.floor((f.x - CONFIG.stageX) / CONFIG.cellW) + 1, 1, CONFIG.cells);
          const o = this.other(f);
          if (c === o.pos) { const d = Math.sign(f.vx) || 1; c = (c + d >= 1 && c + d <= CONFIG.cells) ? c + d : c - d; }
          f.pos = c; this.glide(f, 0.15, 0);
          this.setAnim(f, "idle"); Sfx.land(); this.shakeKick(1, 0.06); this.spark(f.x, CONFIG.floorY, PAL.platform.topEdge, 4, 1.2, true);
          this.note(`P${f.i + 1} 落地 格 ${c}`);
        } else if (f.x < -R.koMargin || f.x > CONFIG.W + R.koMargin || f.y > CONFIG.H + 40) this.ko(f);
      }
    }
    if (this.koTimer !== undefined) { this.koTimer -= dt; if (this.koTimer > 0) return; delete this.koTimer; if (this.afterKO()) return; }
    const settled = this.f.every(f => !f.air && !f.gl);
    if (this.t >= this.dur && settled) this.endRound();
  },
  ko(f) {
    f.out = true; f.air = false; f.trailOn = false; f.trail = []; f.stocks -= 1;
    const K = ART.stage.koBeamX;
    // 左右飛出：固定在 x=16 / 464；往下掉：沿墜落 x，鏡頭外才夾到內側
    const x = f.x < 0 ? K.left : f.x > CONFIG.W ? K.right : clamp(f.x, K.left, K.right);
    this.fx.push({ k: "beam", x: Math.round(x), age: 0, max: ms(FX.koBlast.durationMs) });
    this.shakeKick(FX.cameraShakePx.ko, 0.2);
    Sfx.ko();
    this.popup(clamp(x, 60, CONFIG.W - 60), 96, "KO！", PAL.fx.ko.core, 22);
    this.koTimer = CONFIG.resolve.koPause;
    this.note(`P${f.i + 1} 場外擊落，剩 ${f.stocks} 命`);
  },
  afterKO() {
    const dead = this.f.find(f => f.stocks <= 0);
    if (dead) { this.winner = 1 - dead.i; this.enter(PH.GAMEOVER); return true; }
    for (const f of this.f) {                               // 掉命後重置站位，被擊落的一方損傷歸零
      if (f.out) { f.damage = 0; f.out = false; }
      f.pos = CONFIG.spawn[f.i]; f.x = cellX(f.pos); f.y = CONFIG.floorY; f.air = false; f.vx = f.vy = 0; f.rot = 0; f.stun = 0; f.gl = null; f.trail = []; f.trailOn = false;
      this.setAnim(f, "idle");
    }
    return false;
  },
  endRound() {
    for (const f of this.f) { f.power = Math.min(CONFIG.powerMax, f.power + 1); f.trailOn = false; }   // 本輪結束：雙方力量 +1
    this.popup(CONFIG.W / 2, 110, "力量 +1", PAL.hud.powerFill, 9);
    this.enter(PH.MOVE);
  },
  updGAMEOVER() {},

  // ---------- 演出工具 ----------
  // 角色畫面位置滑到邏輯格子（跟著演出時間走：頓幀時停）
  glide(f, dur, arc) { f.gl = { from: f.x, to: cellX(f.pos), t: 0, dur, arc }; },
  updateGlide(f, vdt) {
    const g = f.gl;
    if (!g) return;
    g.t += vdt;
    const k = clamp(g.t / g.dur, 0, 1);
    f.x = lerp(g.from, g.to, 1 - Math.pow(1 - k, 2)); f.y = CONFIG.floorY - Math.sin(Math.PI * k) * g.arc;
    if (k >= 1) {
      f.x = g.to; f.y = CONFIG.floorY; f.gl = null; f.trailOn = false;
      if (f.anim.state === "roll") { this.setAnim(f, "idle"); Sfx.land(); }
      if (f.anim.state === "knockback" && !f.air) this.setAnim(f, "idle");
    }
  },
  // 殘影：最多 3 張、每 24ms 取樣、96ms 消失（減少動態：1 張）
  updateTrail(f, vdt) {
    const T = FX.motionTrail, max = REDUCED ? ART.effects.reducedMotion.trailMaxAfterimages : T.maxAfterimages;
    for (const s of f.trail) s.age += vdt;
    f.trail = f.trail.filter(s => s.age < ms(T.lifetimeMs));
    if (!f.trailOn || vdt === 0) return;
    f.trailClock += vdt;
    if (f.trailClock >= ms(T.sampleIntervalMs)) {
      f.trailClock = 0;
      f.trail.unshift({ x: f.x, y: f.y, state: f.anim.state, t: f.anim.t, face: f.face, rot: f.rot, age: 0 });
      f.trail.length = Math.min(f.trail.length, max);
    }
  },
  // 頓幀與震動照規格（毫秒、像素）
  hit(ev) {
    this.freeze = Math.max(this.freeze, ms(FX.hitstopMs[ev] ?? 0));
    this.shakeKick(FX.cameraShakePx[ev] ?? 0, ms(FX.hitstopMs[ev] ?? 40) + 0.06);
  },
  shakeKick(px, dur) { if (REDUCED) return; if (px >= this.shake.amp || this.shake.t <= 0) this.shake = { amp: px, t: dur }; },
  spark(x, y, color, n, speed, square) { for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = (0.5 + Math.random()) * speed * 50; this.fx.push({ k: "spark", x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 25, life: 0.18 + Math.random() * 0.18, max: 0.36, color, sz: square ? 2 : 1 }); } },
  ring(x, y, color) { this.fx.push({ k: "ring", x, y, life: 0.3, max: 0.3, color }); },
  popup(x, y, text, color, size) { this.fx.push({ k: "text", x, y, text, color, size, life: 0.9, max: 0.9 }); },
  banner(text, color) { this.fx.push({ k: "banner", text, color, life: 1.6, max: 1.6 }); },
  zoneBlast(zone) {
    for (const c of zone) { this.fx.push({ k: "crack", c, life: 0.5, max: 0.5 }); for (let i = 0; i < 6; i++) this.fx.push({ k: "debris", x: cellX(c) + (Math.random() - 0.5) * 30, y: CONFIG.floorY, vx: (Math.random() - 0.5) * 160, vy: -80 - Math.random() * 120, life: 0.45, max: 0.45 }); }
  },
  updateFx(vdt, dt) {
    for (const p of this.fx) {
      if (p.k === "beam") { p.age += dt; continue; }        // KO 光柱照真實時間
      if (p.k === "text" || p.k === "banner") { p.life -= dt; if (p.k === "text") p.y -= 18 * dt; continue; }
      p.life -= vdt;
      if (p.k === "spark" || p.k === "debris") { p.vy += 500 * vdt; p.x += p.vx * vdt; p.y += p.vy * vdt; }
    }
    this.fx = this.fx.filter(p => (p.k === "beam" ? p.age < p.max : p.life > 0));
  },
  updateCam(dt) {
    const c = this.cam, [a, b] = this.f;
    if (this.shake.t > 0) this.shake.t -= dt;
    const focus = this.phase === PH.COMBO;
    const tx = focus ? (a.x + b.x) / 2 : CONFIG.W / 2, ty = focus ? CONFIG.floorY - 46 : CONFIG.H / 2;
    const k = 1 - Math.exp(-CONFIG.feel.zoomLerp * dt);
    c.zoom = lerp(c.zoom, c.target, k); c.x = lerp(c.x, tx, k); c.y = lerp(c.y, ty, k);
    if (Math.abs(c.zoom - 1) < 0.004 && c.target === 1) { c.zoom = 1; c.x = lerp(c.x, CONFIG.W / 2, 1); c.y = lerp(c.y, CONFIG.H / 2, 1); }
  },
};

// ===================== 像素圖示（14×14 手勢、12×10 箭頭、4×6 數字） =====================

const DIGIT = {

};
// 畫點陣圖：先畫描邊（四方向外擴 1px）再畫填色
function drawBitmap(g, rows, x, y, fill, outline, scale = 1) {
  const W = rows[0].length, H = rows.length;
  if (outline) {
    g.fillStyle = outline;
    for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) if (rows[r][c] === "#") for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) g.fillRect(x + (c + dx) * scale, y + (r + dy) * scale, scale, scale);
  }
  g.fillStyle = fill;
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) if (rows[r][c] === "#") g.fillRect(x + c * scale, y + r * scale, scale, scale);
}

// ===================== Renderer：像素武者 =====================
//   · 有 Sprite Sheet（ART.spriteAtlas.imageByPlayer，跟本頁同資料夾）就照切格表畫：sx = 1 + 50·f，sy = 1 + 50·row，腳底 (24,40) 對齊
//   · 沒有就用程式繪製：本地 48×48 座標、面向右、腳底在 (24,40)；先畫所有部件的 1px 描邊，再畫平塗色塊
//   · 16 個狀態：idle / step / exhausted / stance_rock / stance_scissors / stance_paper / stance_hidden / clash /
//     combo_1 / combo_2 / finisher_blue / finisher_red / parry_success / roll / hitstun / knockback
const Renderer = (() => {
  const A = ART.spriteAtlas, F = PAL.fighters;
  const sheets = [null, null];
  ["p1", "p2"].forEach((p, i) => {                          // 正式圖檔存在就自動接上
    const img = new Image();
    img.onload = () => { if (img.naturalWidth === A.imageWidth && img.naturalHeight === A.imageHeight) sheets[i] = img; };
    img.onerror = () => {};
    img.src = A.imageByPlayer[p];
  });
  // 照 playback 算第幾格
  function frameOf(state, t, f) {
    const an = A.animations[state];
    if (!an) return 0;
    const n = Math.floor(t * an.fps);
    if (an.playback === "loop") return n % an.frames;
    if (an.playback === "hold_last") return Math.min(n, an.frames - 1);
    if (an.playback === "tail_loop") return n < an.frames ? n : an.loopStartFrame + ((n - an.loopStartFrame) % (an.frames - an.loopStartFrame));
    // event_driven：終結技 0–7 格對應判定窗、第 8 格在命中事件上；其他動作從接觸格開始（事件發生時才切進這個動作）
    if (state === "finisher_blue" || state === "finisher_red") {
      if (!f.fin) { const k = Game.phase === PH.FINISHER ? clamp(Game.t / Game.dur, 0, 0.999) : 0; return Math.floor(k * (an.keyFrames.windupLast + 1)); }
      return Math.min(an.frames - 1, an.keyFrames.contact + Math.floor(t * an.fps * 0.5));
    }
    const c = an.keyFrames.contact ?? 0;
    return Math.min(an.frames - 1, c + n);
  }

  // ---- 程式繪製 ----
  let g, OX, OY, FACE, parts;
  const P = (x, y, w, h, c) => parts.push([x, y, w, h, c]);
  function flush(colors, outline) {
    const wx = (x, w) => (FACE > 0 ? OX + (x - 24) : OX - (x - 24) - w);
    const wy = y => OY + (y - 40);
    if (outline) { g.fillStyle = outline; for (const [x, y, w, h, c] of parts) if (c !== "fx") g.fillRect(Math.round(wx(x, w) - 1), Math.round(wy(y) - 1), w + 2, h + 2); }
    for (const [x, y, w, h, c] of parts) { g.fillStyle = colors[c] ?? c; g.fillRect(Math.round(wx(x, w)), Math.round(wy(y)), w, h); }
    parts = [];
  }
  // 身體：主身約 18×26（頭 y12–21、身 y21–32、腿 y32–40）；P1 方肩厚＋奶白腰帶、P2 斜肩＋薄荷領巾＋雙尾短披
  function body(i, o = {}) {
    const dx = o.dx ?? 0, dy = o.dy ?? 0, sp = o.spread ?? 0, hx = dx + (o.hx ?? 0), hy = dy + (o.hy ?? 0);
    if (i === 1) { P(13 + dx, 23 + dy, 3, 9, "S"); P(10 + dx, 25 + dy, 3, 7, "W"); }          // P2 雙尾披片（在背後）
    P(18 - sp, 32, 5, 8, "S"); P(25 + sp, 32, 5, 8, "S");                                      // 腿
    P(17 - sp, 38, 6, 2, "O"); P(25 + sp, 38, 7, 2, "O");                                      // 鞋
    P(17 + dx, 21 + dy, 13, 12, "P"); P(17 + dx, 21 + dy, 3, 12, "S");                       // 身
    P(17 + dx, 29 + dy, 13, 2, i === 0 ? "W" : "S");                                          // 腰帶（P1 亮）
    if (i === 0) P(15 + dx, 20 + dy, 8, 4, "W");                                              // P1 方肩甲
    else { P(19 + dx, 20 + dy, 10, 2, "W"); P(17 + dx, 22 + dy, 3, 2, "W"); }                 // P2 領巾、斜肩
    P(19 + hx, 12 + hy, 9, 9, "K");                                                           // 臉
    if (i === 0) { P(17 + hx, 11 + hy, 13, 2, "S"); P(19 + hx, 8 + hy, 9, 3, "S"); }          // P1 平頂帽緣
    else { P(18 + hx, 10 + hy, 10, 3, "S"); P(20 + hx, 7 + hy, 4, 3, "S"); }                  // P2 髮髻
    if (o.eyes === "x") { P(25 + hx, 15 + hy, 1, 1, "O"); P(27 + hx, 15 + hy, 1, 1, "O"); P(26 + hx, 16 + hy, 1, 1, "O"); P(25 + hx, 17 + hy, 1, 1, "O"); P(27 + hx, 17 + hy, 1, 1, "O"); }
    else if (o.eyes === "shut") P(25 + hx, 16 + hy, 3, 1, "O");
    else P(26 + hx, 15 + hy, 1, 2, "O");
    if (o.mouth) P(25 + hx, 19 + hy, 2, 1, "O");
    return { dx, dy };
  }
  // 武器（剪影要點：石＝高方錘、剪＝低雙尖、布＝寬雙掌）
  const W = {
    rockHigh(dx, dy) {                                     // 雙手舉方錘頭 11×8 在頭頂前側，錘柄斜過肩
      P(26 + dx, 13 + dy, 3, 9, "P"); P(21 + dx, 14 + dy, 3, 8, "S"); P(24 + dx, 11 + dy, 5, 3, "K");
      P(23 + dx, 13 + dy, 2, 2, "B"); P(21 + dx, 15 + dy, 2, 2, "B"); P(19 + dx, 17 + dy, 2, 2, "B");
      P(25 + dx, 2 + dy, 11, 8, "M"); P(26 + dx, 3 + dy, 9, 1, "H"); P(25 + dx, 9 + dy, 11, 1, "B");
    },
    rockSwing(dx, dy, reach) {                             // 錘向前掄出
      P(28 + dx, 23 + dy, 4 + reach, 3, "P"); P(31 + dx + reach, 22 + dy, 3, 4, "K");
      P(34 + dx + reach, 23 + dy, 4, 2, "B"); P(37 + dx + reach, 18 + dy, 9, 10, "M"); P(38 + dx + reach, 19 + dy, 7, 1, "H");
    },
    blades(dx, dy, reach) {                                // 兩把短刃朝前，刀尖高低差 5px、中間留 3px
      P(29 + dx, 24 + dy, 5 + reach, 3, "P"); P(29 + dx, 28 + dy, 4 + reach, 3, "S");
      P(33 + dx + reach, 24 + dy, 2, 3, "K"); P(32 + dx + reach, 28 + dy, 2, 3, "K");
      P(35 + dx + reach, 23 + dy, 9, 2, "M"); P(35 + dx + reach, 23 + dy, 9, 1, "H"); P(44 + dx + reach, 24 + dy, 1, 1, "M");
      P(34 + dx + reach, 28 + dy, 8, 2, "M"); P(34 + dx + reach, 28 + dy, 8, 1, "H"); P(42 + dx + reach, 29 + dy, 1, 1, "M");
    },
    palms(dx, dy, reach) {                                 // 雙肘外張，一掌前上、一掌前下，中間留開放框形
      P(28 + dx, 18 + dy, 4 + reach, 3, "P"); P(32 + dx + reach, 13 + dy, 5, 7, "K"); P(37 + dx + reach, 14 + dy, 1, 5, "K");
      P(28 + dx, 29 + dy, 4 + reach, 3, "S"); P(32 + dx + reach, 29 + dy, 5, 7, "K"); P(37 + dx + reach, 30 + dy, 1, 5, "K");
    },
    armDown(dx, dy) { P(26 + dx, 23 + dy, 3, 8, "P"); P(26 + dx, 31 + dy, 3, 2, "K"); },
  };
  function weaponOf(st, dx, dy, reach) { if (st === "scissors") W.blades(dx, dy, reach); else if (st === "paper") W.palms(dx, dy, reach); else W.rockSwing(dx, dy, reach); }

  const STATES = {
    idle(f, n) { const b = body(f.i, { dy: n === 3 ? 1 : 0 }); W.armDown(b.dx, b.dy); },
    step(f, n) { const b = body(f.i, { spread: n >= 1 && n <= 3 ? 3 : 1, dx: 1 }); W.armDown(b.dx, b.dy); },
    exhausted(f, n) { const b = body(f.i, { dy: 3, dx: 2, hx: 2, hy: n === 2 ? 2 : 1, eyes: "shut", mouth: true }); P(27 + b.dx, 25 + b.dy, 3, 8, "P"); P(27 + b.dx, 33 + b.dy, 3, 2, "K"); sweat(f); },
    stance_rock(f, n) { const b = body(f.i, { spread: 2, dy: n % 2 }); W.rockHigh(b.dx, b.dy); },
    stance_scissors(f, n) { const b = body(f.i, { spread: 3, dx: 2, dy: 3 }); W.blades(b.dx, b.dy + (n % 2), 1); },
    stance_paper(f, n) { const b = body(f.i, { spread: 2, dx: 1 }); W.palms(b.dx, b.dy + (n === 2 ? 1 : 0), 0); },
    stance_hidden(f, n) { const b = body(f.i, { spread: 1, dy: n === 1 ? 1 : 0 }); P(24 + b.dx, 24 + b.dy, 6, 5, "P"); },
    clash(f, n) { const b = body(f.i, { spread: 3, dx: -2, eyes: "shut" }); weaponOf(f.stance, b.dx + 1, b.dy, 2); },
    combo_1(f, n) { const b = body(f.i, { spread: 4, dx: 3 }); weaponOf(f.stance, b.dx, b.dy, 5); },
    combo_2(f, n) { const b = body(f.i, { spread: 5, dx: 5, dy: 1 }); weaponOf(f.stance, b.dx, b.dy, 7); },
    finisher_blue(f, n) {
      if (!f.fin) { const b = body(f.i, { spread: 3, dx: -2 }); weaponOf(f.stance, b.dx - 6, b.dy - 2, 0); }   // 蓄力：武器往後收
      else { const b = body(f.i, { spread: 5, dx: 5 }); weaponOf(f.stance, b.dx, b.dy, 8); }                 // 揮出
    },
    finisher_red(f, n) {
      if (!f.fin) { const b = body(f.i, { spread: 4, dy: 3 }); W.rockHigh(b.dx, b.dy - 2); rim(f); }        // 壓身、舉起重錘、紅色邊光
      else { const b = body(f.i, { spread: 6, dx: 3, dy: 4 }); P(28 + b.dx, 27 + b.dy, 6, 3, "P"); P(33 + b.dx, 29 + b.dy, 12, 10, "M"); P(34 + b.dx, 30 + b.dy, 10, 1, "H"); }
    },
    parry_success(f, n) { const b = body(f.i, { spread: 4, dx: 2 }); P(29 + b.dx, 17 + b.dy, 3, 12, "P"); P(30 + b.dx, 15 + b.dy, 4, 3, "K"); },
    roll(f, n) { P(15, 24, 18, 16, "P"); P(17, 26, 14, 12, "S"); P(22, 28, 7, 6, "K"); P(21, 26, 9, 2, f.i === 0 ? "W" : "S"); },
    hitstun(f, n) { const b = body(f.i, { dx: -3, hx: -2, hy: 1, eyes: "x", mouth: true }); P(20 + b.dx, 23 + b.dy, 3, 7, "P"); },
    knockback(f, n) { const b = body(f.i, { spread: 5, dx: -3, eyes: "x", mouth: true }); P(14 + b.dx, 18 + b.dy, 6, 3, "P"); P(28 + b.dx, 16 + b.dy, 6, 3, "P"); },
  };
  function sweat(f) { const y = Math.floor((f.anim.t * 24) % 8); P(14, 10 + y, 1, 2, "fx"); P(32, 12 + ((y + 4) % 8), 1, 2, "fx"); }
  function rim(f) { P(24, 1, 13, 1, "R"); P(36, 2, 1, 8, "R"); P(15, 19, 1, 5, "R"); }

  function colorsFor(f, mode) {
    const p = F["p" + (f.i + 1)];
    if (mode === "hidden") return { P: F.hiddenFill, S: F.hiddenFill, W: f.i === 0 ? p.secondary : p.secondary, H: F.hiddenFill, K: F.hiddenFill, M: F.hiddenFill, B: F.hiddenFill, O: F.outline, R: PAL.fx.red.rim, fx: "#9CD8FF" };
    if (mode === "white") { const w = PAL.fx.impact.core; return { P: w, S: w, W: w, H: w, K: w, M: w, B: w, O: w, R: w, fx: w }; }
    return { P: p.primary, S: p.shadow, W: p.secondary, H: p.highlight, K: CONFIG.skin, M: F.neutralSteel, B: PAL.platform.oxidizedBronze, O: F.outline, R: PAL.fx.red.rim, fx: "#9CD8FF" };
  }

  return {
    STATES: Object.keys(STATES), frameOf, hasSheet: i => !!sheets[i],
    useSheet(i, img) { sheets[i] = img; },                 // 手動接圖：Renderer.useSheet(0, image)
    drawFighter(ctx, f, state, t, x, y, face, opt = {}) {
      g = ctx; OX = Math.round(x); OY = Math.round(y); FACE = face;
      const n = frameOf(state, t, f);
      const rot = state === "knockback" ? (f.rot || t * 10) : state === "roll" ? face * t * 22 : 0;
      g.save();
      if (opt.alpha !== undefined) g.globalAlpha = opt.alpha;

    ctx.fillRect(x + 1, y0 + 1 + dy, kw - 2, 1); ctx.fillRect(x + 1, y0 + kh - 2 + dy, kw - 2, 1); ctx.fillRect(x + 1, y0 + 1 + dy, 1, kh - 3); ctx.fillRect(x + kw - 2, y0 + 1 + dy, 1, kh - 3);
    const glyph = icon === "left_arrow" ? GLYPH.left : icon === "right_arrow" ? GLYPH.right : GLYPH[icon];
    if (glyph) { const gw = glyph[0].length, gh = glyph.length; drawBitmap(ctx, glyph, x + Math.round((kw - gw) / 2), y0 + 2 + dy + Math.round((kh - 10 - gh) / 2), active && dirOk ? PAL.hud.label : PAL.hud.muted, PAL.fighters.outline); }
    else if (mid === "lock" && i === 1) { ctx.fillStyle = PAL.hud.muted; ctx.fillRect(x + 11, y0 + 7 + dy, 8, 6); ctx.fillRect(x + 12, y0 + 4 + dy, 1, 3); ctx.fillRect(x + 17, y0 + 4 + dy, 1, 3); ctx.fillRect(x + 12, y0 + 4 + dy, 6, 1); }
    ctx.globalAlpha = 1;
  });
}

// ---------- 高解析度文字層（中文才清楚） ----------
function drawHudText(g, time) {
  const ph = Game.phase, r = Game.round, cam = Game.cam;
  const toScreen = (x, y) => [(x - cam.x) * cam.zoom + CONFIG.W / 2, (y - cam.y) * cam.zoom + CONFIG.H / 2];
  g.textBaseline = "alphabetic";
  // 名字（在力量格旁）
  g.font = "bold 7px sans-serif";
  for (const f of Game.f) {
    const right = f.i === 1, team = PAL.fighters["p" + (f.i + 1)];
    g.textAlign = right ? "right" : "left"; g.fillStyle = team.secondary;
    g.fillText(CONFIG.names[f.i], right ? 464 : 16, 66);
    if (f.stun > 0) { g.fillStyle = "#9CD8FF"; g.fillText(`硬直 ${f.stun.toFixed(1)}s`, right ? 464 : 16, 76); }
  }
  // 階段標題＋剩餘秒數（終結判定放大）
  g.textAlign = "center";
  const cue = Game.cue(), fin = ph === PH.FINISHER;
  const left = Math.max(0, Game.dur - Game.t);
  let label = PH_LABEL[ph];
  if (ph === PH.RPS) label += Game.t >= CONFIG.rps.reveal ? "・藏招" : "・亮招";
  if (fin && r) label = r.type === "red" ? "翻滾！紅招不可彈反" : "彈反！按克制手勢";
  g.font = `bold ${fin ? 12 : 10}px sans-serif`;
  g.fillStyle = fin ? (r?.type === "red" ? PAL.fx.red.rim : PAL.fx.blue.rim) : PAL.hud.label;
  g.fillText(label, CONFIG.W / 2, 20);
  if (Game.dur > 0 && ph !== PH.RESOLVE && ph !== PH.GAMEOVER && ph !== PH.CLASH) {
    const urgent = fin ? left <= CONFIG.countdown.urgentSec : (ph === PH.MOVE || ph === PH.RPS) && left <= CONFIG.countdown.phaseTickLast;
    g.font = `bold ${fin ? 13 : 9}px monospace`;
    g.fillStyle = urgent ? (Math.floor(time * 20) % 2 ? PAL.fx.red.rim : PAL.hud.focusOutline) : PAL.hud.label;
    g.fillText(left.toFixed(fin ? 2 : 1), CONFIG.W / 2, fin ? 48 : 43);
  }
  // 底部按鍵小字：兩位玩家的鍵
  const K = ART.hud.keyRow, [kw, kh] = K.keySizePx, x0 = K.centerX - (kw * 3 + K.gapPx * 2) / 2;
  g.font = "bold 6px monospace"; g.fillStyle = PAL.hud.muted;
  ["L", "M", "R"].forEach((b, i) => g.fillText(`${CONFIG.keyLabel[0][b]}·${CONFIG.keyLabel[1][b]}`, x0 + i * (kw + K.gapPx) + kw / 2, K.topY + kh - 2));
  // 兩側提示：誰該做什麼
  g.font = "bold 7px sans-serif";
  for (const f of Game.f) {
    const right = f.i === 1, Kl = CONFIG.keyLabel[f.i];
    let tip = "";
    if (ph === PH.MOVE) tip = f.locked ? "已鎖定" : f.steps >= CONFIG.move.maxSteps ? "步數用完" : `${Kl.L}◀ ${Kl.M}鎖定 ${Kl.R}▶ 每步1氣`;
    else if (ph === PH.RPS) tip = f.stun > 0 ? "硬直中：按鍵鎖死" : Game.committed[f.i] ? "已出招" : `${Kl.L}石 ${Kl.M}剪 ${Kl.R}布`;
    else if (ph === PH.COMBO && r) tip = f.i === r.att ? (f.power >= CONFIG.combo.redCost ? `選終結手勢｜長按${Kl[r.winKey]}=紅招` : "選終結手勢") : "被連轟中…";
    else if (ph === PH.FINISHER && r) tip = f.i === r.def ? (r.type === "blue" ? "按克制手勢！只有一次" : `往 ${r.dirs.map(d => (d < 0 ? Kl.L + "◀" : Kl.R + "▶")).join(" 或 ")} 翻滾！`) : "";
    else if (ph === PH.GAMEOVER) tip = "空白鍵重開";
    g.textAlign = right ? "right" : "left"; g.fillStyle = f.i === (r?.def ?? -1) && fin ? PAL.hud.focusOutline : PAL.hud.label;
    g.fillText(tip, right ? 464 : 16, 252);
  }
  // 浮字與字幕
  for (const p of Game.fx) {
    if (p.k === "text") {
      const a = clamp(p.life / p.max, 0, 1), [sx, sy] = toScreen(p.x, p.y);
      g.globalAlpha = a; g.textAlign = "center"; g.font = `bold ${p.size}px sans-serif`;
      g.fillStyle = PAL.fighters.outline; g.fillText(p.text, sx + 1, sy + 1); g.fillStyle = p.color; g.fillText(p.text, sx, sy);
    } else if (p.k === "banner") {
      const a = clamp(p.life / p.max, 0, 1);
      g.globalAlpha = Math.min(1, a * 2); g.textAlign = "center"; g.font = "bold 16px sans-serif";
      g.fillStyle = "rgba(16,24,39,.8)"; g.fillRect(0, 104, CONFIG.W, 28);
      g.fillStyle = p.color; g.fillText(p.text, CONFIG.W / 2, 124);
    }
  }
  g.globalAlpha = 1;
  if (ph === PH.GAMEOVER) {
    const team = PAL.fighters["p" + (Game.winner + 1)];
    g.fillStyle = "rgba(16,24,39,.85)"; g.fillRect(0, 96, CONFIG.W, 56);
    g.textAlign = "center"; g.fillStyle = team.primary; g.font = "bold 22px sans-serif";
    g.fillText(`${CONFIG.names[Game.winner]} 勝利！`, CONFIG.W / 2, 124);
    g.fillStyle = PAL.hud.label; g.font = "bold 9px sans-serif"; g.fillText("按空白鍵或下方場景按鈕再來一場", CONFIG.W / 2, 142);
  }
  if (Game.debug) {
    g.textAlign = "left"; g.font = "7px monospace"; g.fillStyle = "rgba(10,15,26,.85)"; g.fillRect(4, 72, 236, 150);
    g.fillStyle = "#9fffa8";
    const cuev = Game.cue();
    const lines = [`phase ${ph} t=${Game.t.toFixed(2)}/${Game.dur} freeze=${(Game.freeze * 1000).toFixed(0)}ms`,
      ...Game.f.map(f => `P${f.i + 1} pos${f.pos} pw${f.power} dmg${f.damage} st${f.stocks} stun${f.stun.toFixed(2)} steps${f.steps} ${f.stance ?? "-"} ${f.anim.state}#${Renderer.frameOf(f.anim.state, f.anim.t, f)}`),
      ...[0, 1].map(p => `P${p + 1} keys L:${Input.raw(p, "L")} M:${Input.raw(p, "M")} R:${Input.raw(p, "R")}`),
      r ? `round att=P${r.att + 1} win=${r.winGesture} gest=${r.gesture} red=${r.red} chg=${r.charging}` : "",
      cuev ? `cue ${cuev.kind} left=${((cuev.deadlineAt - cuev.now) * 1000).toFixed(0)}ms tiles=${cuev.dangerTiles} safe=${cuev.safeDirs}` : "",
      `sprite p1=${Renderer.hasSheet(0) ? "PNG" : "程式繪製"} p2=${Renderer.hasSheet(1) ? "PNG" : "程式繪製"} reduced=${REDUCED}`,
      ...Game.log.slice(-7)];
    lines.forEach((l, i) => g.fillText(l, 8, 82 + i * 9));
  }
}

function render(time) {
  const cam = Game.cam;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawBackground(time);
  // 世界層：震動用整數像素位移；平台與警示同一投影
  const amp = Game.shake.t > 0 ? Game.shake.amp : 0;
  const sx = amp ? Math.round((Math.random() * 2 - 1) * amp) : 0, sy = amp ? Math.round((Math.random() * 2 - 1) * amp) : 0;
  const z = cam.zoom;
  ctx.setTransform(z, 0, 0, z, Math.round(CONFIG.W / 2 - cam.x * z) + sx, Math.round(CONFIG.H / 2 - cam.y * z) + sy);
  drawStage();
  drawHazardFill(time);
  drawTrails();
  drawFighters();
  drawFx();
  drawHazardEdges();
  drawTelegraphs(time);
  // HUD 不跟著震動
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawHudPixels(time);
  // 放大到螢幕（整數倍率）
  const s = scale * (screen.dpr || 1);
  sctx.setTransform(1, 0, 0, 1, 0, 0);
  sctx.imageSmoothingEnabled = false;
  sctx.drawImage(buf, 0, 0, screen.width, screen.height);
  sctx.setTransform(s, 0, 0, s, 0, 0);
  drawHudText(sctx, time);
}

// ===================== 主迴圈（固定步長 1/120 秒） =====================
const STEP = 1 / 120;
let acc = 0, last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  acc += dt;
  while (acc >= STEP) { Game.update(STEP); acc -= STEP; }
  render(now / 1000);
  requestAnimationFrame(frame);
}
document.querySelectorAll("#bar button").forEach(b => b.addEventListener("click", () => { Sfx.unlock(); Game.loadScenario(Number(b.dataset.sc)); b.blur(); }));
Game.loadScenario(0);
requestAnimationFrame(frame);
// 驗收／除錯用
window.__fist = { Game, CONFIG, ART, Input, Renderer };
</script>
